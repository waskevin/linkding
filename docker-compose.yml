version: "3.8"

# TOS 7 Docker application - Linkding
# Rules: Compose 3.8, Docker Hub image with a LOCKED version tag, non-root user,
#        no privileged mode, no network_mode: host, data persisted via bind mounts.
#
# container_name is intentionally omitted: Compose then derives a globally unique
# name (<project>_<service>_1), so the application never fails to install because
# the device already runs a container called "linkding".
#
# Why the command is overridden instead of using the image's ./bootstrap.sh:
#   The upstream image is built for root: bootstrap.sh runs `chown -R www-data`,
#   uwsgi.ini hardcodes `uid = www-data` / `gid = www-data`, and the default
#   background-task supervisor also drops privileges. Inside a container that is
#   started as a non-root user (1000:1000) none of that can work, and uwsgi would
#   refuse to start. This command performs the same bootstrap steps as uid 1000 and
#   starts uwsgi with the privilege-dropping lines removed. Background tasks
#   (Wayback Machine snapshots, auto-tagging, previews) are therefore disabled -
#   they cannot run without root in this image.
#
# No credential is hardcoded: the initial administrator password is generated on
# first start into the data volume (data/.admin_password) and never written to logs.

services:
  linkding:
    image: sissbruecker/linkding:1.47.0
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "10002:9090"
    volumes:
      - ./data:/etc/linkding/data
    environment:
      - TZ=Asia/Shanghai
      - LD_DISABLE_BACKGROUND_TASKS=True
      - LD_SUPERUSER_NAME=admin
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /etc/linkding
        mkdir -p data/favicons data/previews data/assets
        umask 077
        [ -s data/.admin_password ] || head -c 24 /dev/urandom | base64 | tr -d '/+=' | cut -c1-16 > data/.admin_password
        export LD_SUPERUSER_PASSWORD="$(cat data/.admin_password)"
        python manage.py generate_secret_key
        python manage.py migrate
        python manage.py enable_wal
        python manage.py create_initial_superuser
        grep -v -e '^uid = ' -e '^gid = ' uwsgi.ini > data/uwsgi.runtime.ini
        exec uwsgi --http 0.0.0.0:9090 --ini data/uwsgi.runtime.ini
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

x-app-meta:
  web:
    port: 10002
    protocol: http
